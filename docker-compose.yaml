services:
  ridesharing-api:
    build: .
    container_name: ridesharing-userver-api
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - mongo

  postgres:
    image: postgres:16
    container_name: ridesharing-postgres
    environment:
      POSTGRES_DB: ridesharing_db
      POSTGRES_USER: ridesharing_user
      POSTGRES_PASSWORD: ridesharing_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./sql/data.sql:/docker-entrypoint-initdb.d/02_data.sql

  mongo:
    image: mongo:7
    container_name: ridesharing-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo/data.js:/docker-entrypoint-initdb.d/01_data.js:ro

volumes:
  postgres_data:
  mongo_data: