services:
  ridesharing-api:
    build: .
    container_name: ridesharing-userver-api
    ports:
      - "8080:8080"
    depends_on:
      - postgres
      - mongo
      - redis
      - rabbitmq

  postgres:
    image: postgres:16
    container_name: ridesharing-postgres
    environment:
      POSTGRES_DB: ridesharing_db
      POSTGRES_USER: ridesharing_user
      POSTGRES_PASSWORD: ridesharing_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql
      - ./sql/data.sql:/docker-entrypoint-initdb.d/02_data.sql

  mongo:
    image: mongo:7
    container_name: ridesharing-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      - ./mongo/data.js:/docker-entrypoint-initdb.d/01_data.js:ro

  redis:
    image: redis:7
    container_name: ridesharing-redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: ridesharing-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ridesharing
      RABBITMQ_DEFAULT_PASS: ridesharing_password

volumes:
  postgres_data:
  mongo_data: