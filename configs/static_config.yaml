components_manager:
  task_processors:
    main-task-processor:
      worker_threads: 4

    fs-task-processor:
      worker_threads: 2

  default_task_processor: main-task-processor

  components:
    server:
      listener:
        port: 8080
        task_processor: main-task-processor

    logging:
      fs-task-processor: fs-task-processor
      loggers:
        default:
          file_path: '@stderr'
          level: info
          overflow_behavior: discard

    handler-ping:
      path: "/ping"
      method: GET
      task_processor: main-task-processor

    handler-register:
      path: "/api/v1/auth/register"
      method: POST
      task_processor: main-task-processor

    handler-login:
      path: "/api/v1/auth/login"
      method: POST
      task_processor: main-task-processor

    handler-user-by-login:
      path: "/api/v1/users/by-login/{login}"
      method: GET
      task_processor: main-task-processor

    handler-users-search:
      path: "/api/v1/users/search"
      method: GET
      task_processor: main-task-processor

    handler-create-route:
      path: "/api/v1/routes"
      method: POST
      task_processor: main-task-processor

    handler-user-routes:
      path: "/api/v1/users/{user_id}/routes"
      method: GET
      task_processor: main-task-processor

    handler-create-trip:
      path: "/api/v1/trips"
      method: POST
      task_processor: main-task-processor

    handler-join-trip:
      path: "/api/v1/trips/{trip_id}/join"
      method: POST
      task_processor: main-task-processor

    handler-get-trip:
      path: "/api/v1/trips/{trip_id}"
      method: GET
      task_processor: main-task-processor